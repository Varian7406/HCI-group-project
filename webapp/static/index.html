<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Maintenance</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>PC Maintenance — <span id="hdr-cond">condition ?</span></h1>
  <nav>
    <span id="hdr-step"></span>
    <button id="btn-pause">Pause</button>
    <button id="btn-review">Review previous</button>
    <button id="btn-exit">Exit session</button>
  </nav>
</header>

<main>
  <section id="setup" class="card">
    <h2>Session setup (researcher)</h2>
    <label>Participant code
      <input id="f-code" placeholder="e.g. P07" autocomplete="off">
    </label>
    <label>Condition order
      <select id="f-order">
        <option>ABC</option><option>ACB</option><option>BAC</option>
        <option>BCA</option><option>CAB</option><option>CBA</option>
      </select>
    </label>
    <label>Procedure
      <select id="f-proc">
        <option value="pc_ram">RAM replacement</option>
        <option value="pc_gpu">Graphics card replacement</option>
        <option value="pc_fan">Case fan replacement</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="f-practice" checked> Practice mode</label>
    <p id="setup-error" class="error hidden"></p>
    <button id="btn-start">Start session</button>
    <p class="note">Logs land in <code>data/raw-local/&lt;session_id&gt;/</code>.</p>
  </section>

  <section id="task" class="hidden">
    <div class="pc-pane" id="pc-pane">
      <svg id="pc" viewBox="0 0 800 680" preserveAspectRatio="xMidYMid meet"
           aria-label="Simulated PC, top-down view">
        <defs>
          <linearGradient id="g-chassis" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#eaf2fc"/>
            <stop offset="1" stop-color="#d3e5f8"/>
          </linearGradient>
          <linearGradient id="g-panel" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0" stop-color="#f7fafd"/><stop offset="0.55" stop-color="#e4eef9"/>
            <stop offset="1" stop-color="#cfe2f5"/>
          </linearGradient>
          <linearGradient id="g-pcb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
          </linearGradient>
          <linearGradient id="g-alu" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#f1f5f9"/><stop offset="0.35" stop-color="#cbd5e1"/>
            <stop offset="0.65" stop-color="#e2e8f0"/><stop offset="1" stop-color="#b6c4d4"/>
          </linearGradient>
          <linearGradient id="g-gpu" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e8eef6"/><stop offset="0.5" stop-color="#cdd9e8"/>
            <stop offset="1" stop-color="#b3c4d8"/>
          </linearGradient>
          <radialGradient id="g-hub" cx="45%" cy="40%" r="60%">
            <stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/>
          </radialGradient>
          <radialGradient id="g-coin" cx="40%" cy="35%" r="65%">
            <stop offset="0" stop-color="#f8fafc"/><stop offset="0.55" stop-color="#cbd5e1"/>
            <stop offset="1" stop-color="#94a3b8"/>
          </radialGradient>
          <pattern id="p-vent" width="8" height="8" patternUnits="userSpaceOnUse">
            <circle cx="4" cy="4" r="1.6" fill="#b9cde4"/>
          </pattern>
          <pattern id="p-traces" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 0 10 H 12 L 20 18 H 40 M 10 0 V 8 L 16 14 M 0 32 H 26 L 34 24 H 40"
                  fill="none" stroke="#a5c8ec" stroke-width="0.8"/>
            <circle cx="20" cy="18" r="1.2" fill="#8fbae4"/>
            <circle cx="16" cy="14" r="1.2" fill="#8fbae4"/>
          </pattern>
          <filter id="f-shadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3a5f" flood-opacity="0.35"/>
          </filter>
        </defs>

        <!-- ================= chassis interior ================= -->
        <rect x="10" y="10" width="780" height="660" rx="14" fill="url(#g-chassis)"
              stroke="#9db8d6" stroke-width="3"/>
        <rect x="20" y="20" width="760" height="640" rx="10" fill="none"
              stroke="#c3d7ee" stroke-width="1.5"/>

        <!-- cable-management grommets (right edge) -->

            <path d="M 300 190 Q 322 158 310 132 Q 294 134 292 162 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.9" transform="rotate(320 300 190)"/>

          <text x="300" y="193" fill="#f1f5f9" font-size="7.5" font-weight="bold" font-family="monospace" text-anchor="middle">CPU</text>
        </g>

        <!-- CPU_FAN header + wire to cooler -->
        <g>
          <path class="wire" d="M 319 92 C 316 110 310 130 302 150" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
          <rect x="338" y="69" width="38" height="20" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

        </g>

        <!-- ================= DDR5 bank: TWO slots, TWO sticks ================= -->
        <text x="500" y="68" fill="#64748b" font-size="8" font-weight="bold" font-family="monospace" text-anchor="middle">DDR5 DIMM A2 · B2</text>
        <g>
          <rect x="460" y="82" width="18" height="216" rx="2.5" fill="#e8f1fa" stroke="#60a5fa" stroke-width="1.5"/>

        <!-- clips for slot A2 (INTERACTIVE) -->

        <rect id="overlay" class="hidden" fill="none" stroke="#3b82f6"

        <span id="hazard-text"></span>
        <div id="hazard-timer"><div id="hazard-timer-fill"></div></div>
      </div>

    <aside class="guidance">
      <h2>Instructions</h2>
      <p id="step-counter"></p>
      <p id="instruction"></p>
      <p id="explanation" class="hidden"></p>
      <p id="reviewed-box" class="hidden">
        <strong>Previous step:</strong> <span id="reviewed-text"></span>
      </p>
      <div id="feedback" class="hidden" role="status"></div>
      <button id="btn-hint" class="hidden">Show me</button>
      <div id="gauge-box">
        <p>Voltage gauge — press <kbd>Space</kbd> to centre <span id="gauge-hits"></span></p>
        <div id="gauge"><div id="gauge-band"></div><div id="gauge-needle"></div></div>
      </div>
    </aside>

    <div id="overlay-paused" class="hidden">
      <div class="card"><h2>Paused</h2><p>Click Resume to continue.</p>
      <button id="btn-resume">Resume</button></div>
    </div>
    <div id="overlay-done" class="hidden">
      <div class="card"><h2>Procedure complete</h2><p id="done-text"></p>
      <button id="btn-finish">Finish</button></div>
    </div>
  </section>
</main>
